<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#fd7115" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Beta Climb" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Beta Climb</title>
    <style>
      /* Первый кадр. Те же значения, что --bg в src/shared/theme.css */
      :root { --bg: #fd7115; }
      @media (prefers-color-scheme: dark) {
        html:not(.is-light) { --bg: #1e1e1e; }
      }
      html.is-night { --bg: #1e1e1e; }
      html.is-light { --bg: #fd7115; }
      html, body, #root {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
    </style>
    <script>
      (function () {
        var choice = localStorage.getItem('beta-climb.theme')
        var root = document.documentElement
        root.classList.toggle('is-night', choice === 'dark')
        root.classList.toggle('is-light', choice === 'light')
        var bg = getComputedStyle(root).getPropertyValue('--bg').trim()
        root.style.colorScheme = choice === 'dark' ? 'dark' : choice === 'light' ? 'light' : 'light dark'
        var screenW = Math.min(screen.width, screen.height)
        var screenH = Math.max(screen.width, screen.height)
        var screenCorners = {
          '375x812': 44,
          '390x844': 47,
          '393x852': 55,
          '402x874': 62,
          '414x896': 42,
          '428x926': 53,
          '430x932': 55,
          '440x956': 62,
        }
        var screenKey = Math.round(screenW) + 'x' + Math.round(screenH)
        var screenCorner = screenCorners[screenKey]
        if (!screenCorner && screenW >= 320 && screenW <= 480 && screenH >= 680) {
          screenCorner = Math.max(32, Math.round(screenW * 0.12))
        }
        root.style.setProperty('--screen-corner', (screenCorner || 47) + 'px')
        var theme = document.querySelector('meta[name="theme-color"]')
        if (theme) theme.setAttribute('content', bg)
        var scheme = document.querySelector('meta[name="color-scheme"]')
        if (scheme) scheme.setAttribute('content', choice === 'dark' ? 'dark' : choice === 'light' ? 'light' : 'light dark')
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
