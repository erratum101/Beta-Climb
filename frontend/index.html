<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var tag = ((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase()
        document.documentElement.lang = tag.indexOf('ru') === 0 ? 'ru' : 'en'
      })()
    </script>
    <script>
      (function () {
        if (!('serviceWorker' in navigator) || !window.isSecureContext) return
        var mark = '/__bc-stitch'
        function reloadOnce() {
          try {
            if (sessionStorage.getItem('bc-re') === '1') return
            sessionStorage.setItem('bc-re', '1')
          } catch (e) {}
          location.reload()
        }
        function arm() {
          navigator.serviceWorker.addEventListener('controllerchange', reloadOnce)
          return caches.open('bc-net').then(function (cache) {
            return cache.put(mark, new Response('1'))
          }).then(function () {
            return navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
          }).then(function (reg) {
            if (reg.active && !navigator.serviceWorker.controller) reloadOnce()
          })
        }
        caches.open('bc-net').then(function (cache) {
          return cache.match(mark)
        }).then(function (hit) {
          if (hit && navigator.serviceWorker.controller) {
            try { sessionStorage.removeItem('bc-re') } catch (e) {}
            return
          }
          if (hit) return arm()
          var slow = new Promise(function (resolve) { setTimeout(function () { resolve(0) }, 2500) })
          var got = fetch('/icon.svg', { cache: 'no-store' }).then(function (res) {
            var need = Number(res.headers.get('content-length') || 0)
            if (!need || need <= 2200) return need || 1
            return Promise.race([
              res.arrayBuffer().then(function (buf) { return buf.byteLength >= need ? need : 0 }),
              slow,
            ])
          })
          return Promise.race([got, slow]).then(function (size) {
            if (size) return
            return arm()
          })
        }).catch(function () {})
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Beta Climb" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Beta Climb</title>
    <style>
      /* Первый кадр. Те же значения, что --bg в src/shared/theme.css */
      :root { --bg: #fd7115; }
      html.is-night { --bg: #1e1e1e; }
      html, body, #root {
        margin: 0;
        height: 100%;
        background: var(--bg);
      }
    </style>
    <script>
      (function () {
        var KEY = 'beta-climb.route'
        var PATH = /^\/(auth|welcome|onboarding|home|climbs|history|profile|attempt\/new|attempt\/(?!new\/)[^/]+\/processing|attempt\/(?!new$)[^/]+|compare\/[^/]+)$/

        function handheld() {
          var ua = navigator.userAgent
          if (/Android|iPhone|iPad|iPod|Mobile/i.test(ua)) return true
          if (navigator.maxTouchPoints > 1 && /Macintosh/i.test(ua)) return true
          return matchMedia('(pointer: coarse)').matches && matchMedia('(max-width: 820px)').matches
        }

        function installed() {
          var phone = handheld()
          var standalone = navigator.standalone === true
            || matchMedia('(display-mode: standalone)').matches
            || (phone && matchMedia('(display-mode: fullscreen)').matches)
          var params = new URLSearchParams(location.search)
          var fromHome = phone && params.get('source') === 'home'
          if (!phone) {
            try {
              if (location.pathname === '/app' && params.get('source') === 'home') {
                sessionStorage.setItem('beta-climb.desktop-app', '1')
              }
              if (location.pathname !== '/' && sessionStorage.getItem('beta-climb.desktop-app') === '1') return true
            } catch (e) {}
          }
          return standalone || fromHome
        }

        window.addEventListener('pagehide', function () {
          try {
            var path = location.pathname
            if (!PATH.test(path)) return
            localStorage.setItem(KEY, JSON.stringify({ href: path + location.search + location.hash }))
          } catch (e) {}
        })
      })()
    </script>
    <script>
      (function () {
        var choice = null
        var seen = null
        try {
          if (localStorage.getItem('beta-climb.theme-set') === '1') {
            choice = localStorage.getItem('beta-climb.theme')
          } else {
            localStorage.removeItem('beta-climb.theme')
          }
          seen = localStorage.getItem('beta-climb.theme-system')
        } catch (e) {}
        var root = document.documentElement
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var systemValue = systemDark ? 'dark' : 'light'
        if (seen != null && seen !== systemValue) {
          choice = null
          try {
            localStorage.removeItem('beta-climb.theme-set')
            localStorage.removeItem('beta-climb.theme')
          } catch (e) {}
        }
        var night = choice === 'dark' || (choice == null && systemDark)
        root.classList.toggle('is-night', night)
        root.classList.toggle('is-light', !night)
        var scheme = night ? 'dark' : 'light'
        var installed = window.navigator.standalone === true
          || window.matchMedia('(display-mode: standalone)').matches
          || window.matchMedia('(display-mode: fullscreen)').matches
        root.style.colorScheme = installed ? scheme : 'normal'
        var screenW = Math.min(screen.width, screen.height)
        var screenH = Math.max(screen.width, screen.height)
        var screenCorners = {
          '375x812': 44,
          '390x844': 47,
          '393x852': 55,
          '402x874': 62,
          '414x896': 42,
          '428x926': 53,
          '430x932': 55,
          '440x956': 62,
        }
        var screenKey = Math.round(screenW) + 'x' + Math.round(screenH)
        var screenCorner = screenCorners[screenKey]
        if (!screenCorner && screenW >= 320 && screenW <= 480 && screenH >= 680) {
          screenCorner = Math.max(32, Math.round(screenW * 0.12))
        }
        root.style.setProperty('--screen-corner', (screenCorner || 47) + 'px')
        var schemeMeta = document.querySelector('meta[name="color-scheme"]')
        if (installed) {
          if (schemeMeta) schemeMeta.setAttribute('content', scheme)
        } else if (schemeMeta) {
          schemeMeta.remove()
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var path = location.pathname
        if (path !== '/' && path !== '/app') return
        var link = document.createElement('link')
        link.rel = 'preload'
        link.as = 'video'
        link.href = '/bg.mp4'
        document.head.appendChild(link)
        if (path === '/app') {
          var anim = document.createElement('link')
          anim.rel = 'preload'
          anim.as = 'image'
          anim.href = '/bg.webp?v=2'
          document.head.appendChild(anim)
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
