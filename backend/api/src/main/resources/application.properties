spring.application.name=api
server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.servlet.multipart.max-file-size=${VIDEO_MAX_FILE_SIZE:250MB}
spring.servlet.multipart.max-request-size=${VIDEO_MAX_REQUEST_SIZE:251MB}
spring.servlet.multipart.file-size-threshold=0

spring.datasource.url=${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:betaclimb}}
spring.datasource.username=${DB_USERNAME:${PGUSER:betaclimb}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:}}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.datasource.hikari.schema=${DB_SCHEMA:public}
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
spring.flyway.default-schema=${DB_SCHEMA:public}
spring.flyway.schemas=${DB_SCHEMA:public}
