name: beta-climb

services:
  db:
    image: postgres:17-alpine
    profiles: ["local-db"]
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: betaclimb
      POSTGRES_USER: betaclimb
      POSTGRES_PASSWORD: betaclimb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betaclimb -d betaclimb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: api/Dockerfile
    env_file:
      - path: .env.managed
        format: raw
    environment:
      DB_SCHEMA: betaclimb
    volumes:
      - type: bind
        source: ${HOME}/.cloud-certs/root.crt
        target: /certs/root.crt
        read_only: true
        bind:
          create_host_path: false

  frontend:
    build:
      context: ../frontend
    ports:
      - "127.0.0.1:5174:80"
    depends_on:
      - api

volumes:
  postgres_data:
