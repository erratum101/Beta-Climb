name: beta-climb

services:
  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: betaclimb
      POSTGRES_USER: betaclimb
      POSTGRES_PASSWORD: betaclimb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betaclimb -d betaclimb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: api/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/betaclimb
      DB_USERNAME: betaclimb
      DB_PASSWORD: betaclimb
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
